<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wikipedia Multistream MCP</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    h1 { margin-bottom: .25rem; } h2 { margin-top: 2rem; }
    .muted { color: #777; } .error { color: #d33; white-space: pre-wrap; }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #8885; }
    th { position: sticky; top: 0; background: Canvas; }
    button, input { font: inherit; padding: .35rem .55rem; }
    button { cursor: pointer; } button:disabled { cursor: wait; opacity: .6; }
    .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
    .grow { flex: 1; min-width: 14rem; }
    progress { width: 9rem; } code { font-size: .85em; }
    .ready { color: #198754; } .working { color: #b77900; } .failed { color: #c33; }
  </style>
</head>
<body>
  <h1>Wikipedia Multistream MCP</h1>
  <div class="muted">Local dashboard · MCP endpoint <code>/mcp</code> · refreshes jobs every 2 seconds</div>
  <p id="error" class="error"></p>

  <h2>Local wikis</h2>
  <div id="local">Loading…</div>

  <h2>Jobs</h2>
  <div id="jobs">Loading…</div>

  <h2>Available online</h2>
  <form id="search" class="row">
    <input id="filter" class="grow" placeholder="Filter database names, e.g. dawiki">
    <button>Search</button>
    <button type="button" id="refresh">Refresh upstream</button>
  </form>
  <div id="available" style="margin-top:1rem">Enter a filter or browse the first page.</div>

<script>
const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let busyWikis = new Set();
function bytes(value) {
  const n = Number(value || 0), units = ['B','KiB','MiB','GiB','TiB'];
  if (!n) return '0 B';
  const unit = Math.min(Math.floor(Math.log(n) / Math.log(1024)), units.length - 1);
  return `${(n / Math.pow(1024, unit)).toFixed(unit ? 1 : 0)} ${units[unit]}`;
}
function duration(seconds) {
  if (!Number.isFinite(seconds) || seconds < 0) return '—';
  if (seconds < 60) return `${Math.ceil(seconds)}s`;
  if (seconds < 3600) return `${Math.floor(seconds/60)}m ${Math.ceil(seconds%60)}s`;
  return `${Math.floor(seconds/3600)}h ${Math.ceil((seconds%3600)/60)}m`;
}
const terminal = s => ['downloaded','ready','up_to_date','failed','canceled'].includes(s);

async function api(path, options) {
  const response = await fetch(path, options);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || response.statusText);
  return data;
}

async function maintain(wiki, action, button) {
  button.disabled = true;
  try {
    await api(`/api/dashboard/wiki/${encodeURIComponent(wiki)}/${action}`, {method:'POST',headers:{'X-Wikipedia-MCP':'1'}});
    busyWikis.add(wiki);
    await loadState();
    await loadAvailable();
  } catch (error) { showError(error); }
  finally { button.disabled = busyWikis.has(wiki); }
}

async function jobAction(id, action, button) {
  button.disabled = true;
  try {
    await api(`/api/dashboard/job/${encodeURIComponent(id)}/${action}`, {method:'POST',headers:{'X-Wikipedia-MCP':'1'}});
    await loadState();
  } catch (error) { showError(error); }
}

function table(headers, rows) {
  if (!rows.length) return '<p class="muted">None.</p>';
  return `<table><thead><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`;
}

async function loadState() {
  try {
    const [local, jobs, upgrades] = await Promise.all([
      api('/api/dashboard/local'), api('/api/dashboard/jobs'), api('/api/dashboard/upgrades')
    ]);
    const upgradeMap = Object.fromEntries(upgrades.map(x => [x.name, x]));
    busyWikis = new Set(jobs.filter(j => !terminal(j.state)).map(j => j.wiki));
    $('local').innerHTML = table(['Wiki','Dump','State','Pages','Search','Disk','Upgrade','Action'], local.map(w => {
      const up = upgradeMap[w.wiki];
      const disabled = busyWikis.has(w.wiki) ? ' disabled' : '';
      const action = !w.title_ready ? `<button data-wiki="${esc(w.wiki)}" data-action="update"${disabled}>Index</button>` :
        !w.body_ready ? `<button data-wiki="${esc(w.wiki)}" data-action="update"${disabled}>Resume indexing</button>` :
        up?.update_available ? `<button data-wiki="${esc(w.wiki)}" data-action="update"${disabled}>Update</button>` : 'Current';
      return `<tr><td><strong>${esc(w.wiki)}</strong></td><td>${esc(w.dump_date)}</td><td>${esc(w.state)}</td><td>${Number(w.page_count).toLocaleString()}</td><td>${esc(w.search_mode)}</td><td>${bytes(w.disk_bytes)}</td><td>${up?.update_available ? esc(up.dump_date) : '—'}</td><td>${action}</td></tr>`;
    }));
    $('jobs').innerHTML = table(['Wiki','Kind','State','Progress','Message','Updated','Action'], jobs.slice(0,25).map(j => {
      const max = Number(j.total || 0), value = Math.min(Number(j.completed || 0), max || Number(j.completed || 0));
      let detail = '';
      if (j.units === 'bytes' && max) {
        const speed = Number(j.rate || 0);
        detail = `${bytes(value)} / ${bytes(max)}${speed ? ` · ${bytes(speed)}/s · ETA ${duration((max-value)/speed)}` : ''}`;
      } else if (max) detail = `${value.toLocaleString()} / ${max.toLocaleString()} ${esc(j.units || '')}`;
      else if (value) detail = `${value.toLocaleString()} ${esc(j.units || '')}`;
      const progress = terminal(j.state) ? detail : `${max ? `<progress value="${value}" max="${max}"></progress> ` : ''}${detail}`;
      const cls = j.state === 'failed' ? 'failed' : terminal(j.state) ? 'ready' : 'working';
      let action = '—';
      if (['discovering','downloading','title_indexing','body_indexing'].includes(j.state)) action = `<button data-job="${esc(j.id)}" data-job-action="pause">Pause</button> <button data-job="${esc(j.id)}" data-job-action="cancel">Cancel</button>`;
      else if (j.state === 'queued') action = `<button data-job="${esc(j.id)}" data-job-action="cancel">Cancel</button>`;
      else if (j.state === 'paused') action = `<button data-job="${esc(j.id)}" data-job-action="resume">Resume</button> <button data-job="${esc(j.id)}" data-job-action="cancel">Cancel</button>`;
      else if (['failed','canceled'].includes(j.state)) action = `<button data-job="${esc(j.id)}" data-job-action="retry">Retry</button>`;
      return `<tr><td>${esc(j.wiki)}</td><td>${esc(j.kind)}</td><td class="${cls}">${esc(j.state)}</td><td>${progress}</td><td>${esc(j.error || j.message)}</td><td>${esc(new Date(j.updated_at).toLocaleString())}</td><td>${action}</td></tr>`;
    }));
    bindButtons(); $('error').textContent = '';
  } catch (error) { showError(error); }
}

async function loadAvailable(refresh=false, offset=0) {
  try {
    const filter = $('filter').value.trim();
    const data = await api(`/api/dashboard/available?filter=${encodeURIComponent(filter)}&offset=${offset}&limit=25&refresh=${refresh}`);
    $('available').innerHTML = table(['Wiki','Dump','Download','Index','Parts','Installed','Action'], data.wikis.filter(w=>w.multistream_available).map(w => {
      const busy = busyWikis.has(w.name), disabled = busy ? ' disabled' : '';
      let action = busy ? `<button disabled>${w.installed ? 'Working…' : 'Queued…'}</button>` :
        w.installed ? (w.update_available ? `<button data-wiki="${esc(w.name)}" data-action="update"${disabled}>Update</button>` : 'Current') : `<button data-wiki="${esc(w.name)}" data-action="download"${disabled}>Download</button>`;
      return `<tr><td><strong>${esc(w.name)}</strong>${w.closed?' <span class="muted" title="Historical Wikimedia project; public content is preserved but normal editing is locked">closed/read-only</span>':''}</td><td>${esc(w.dump_date)}</td><td>${bytes(w.dump_size)}</td><td>${bytes(w.index_size)}</td><td>${Number(w.part_count || 1).toLocaleString()}</td><td>${w.installed?'yes':'no'}</td><td>${action}</td></tr>`;
    })) + (data.next_offset ? `<p><button id="next">Next page</button></p>` : '');
    bindButtons();
    if (data.next_offset) $('next').onclick = () => loadAvailable(false, data.next_offset);
    $('error').textContent = '';
  } catch (error) { showError(error); }
}

function bindButtons() {
  document.querySelectorAll('button[data-action]').forEach(button => {
    button.disabled = busyWikis.has(button.dataset.wiki);
    button.onclick = () => maintain(button.dataset.wiki, button.dataset.action, button);
  });
  document.querySelectorAll('button[data-job-action]').forEach(button => {
    button.onclick = () => jobAction(button.dataset.job, button.dataset.jobAction, button);
  });
}
function showError(error) { $('error').textContent = error.message || String(error); }
$('search').onsubmit = event => { event.preventDefault(); loadAvailable(); };
$('refresh').onclick = () => loadAvailable(true);
async function initialize() {
  await loadState();
  await loadAvailable();
  setInterval(loadState, 2000);
  setInterval(loadAvailable, 10000);
}
initialize();
</script>
</body>
</html>
